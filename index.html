<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cheque Draft Generator</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
        }
        h1 { color: #333; margin-bottom: 10px; font-size: 28px; }
        .subtitle { color: #666; margin-bottom: 30px; font-size: 14px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: 600; margin-bottom: 8px; color: #333; font-size: 14px; }
        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            transition: all 0.3s;
            font-family: inherit;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        input.error { border-color: #d32f2f; background-color: #ffebee; }
        .format-hint { display: block; font-size: 12px; color: #999; margin-top: 6px; }
        .error-message { color: #d32f2f; font-size: 12px; margin-top: 6px; display: none; }
        .error-message.show { display: block; }
        .preview-box {
            background: #f5f5f5;
            padding: 16px;
            border-radius: 6px;
            min-height: 60px;
            display: flex;
            align-items: center;
            color: #999;
            font-style: italic;
            margin-top: 8px;
        }
        .preview-box.filled { background: #fffbf0; border-left: 4px solid #667eea; color: #333; font-style: normal; }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }
        button:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4); }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        .spinner { display: inline-block; width: 14px; height: 14px; margin-right: 8px; border: 2px solid rgba(255, 255, 255, 0.3); border-top-color: white; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .form-section { display: block; }
        .form-section.hidden { display: none; }
        .success-section { display: none; text-align: center; }
        .success-section.show { display: block; }
        .success-icon { font-size: 48px; margin-bottom: 16px; }
        .success-text { color: #2e7d32; margin-bottom: 20px; }
        .success-text h2 { margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏦 Cheque Draft Generator</h1>
        <p class="subtitle">Fill in the fields to generate your .ods file</p>

        <div id="formSection" class="form-section">
            <form id="chequeForm">
                <div class="form-group">
                    <label for="payee">Payee Name (FIELD1)</label>
                    <input type="text" id="payee" placeholder="Jane Doe" required>
                    <span class="format-hint">Format: First Last</span>
                    <p class="error-message" id="payeeError"></p>
                </div>

                <div class="form-group">
                    <label for="date">Date (FIELD2)</label>
                    <input type="text" id="date" placeholder="15-Mar-2026" required>
                    <span class="format-hint">Format: DD-MMM-YYYY</span>
                    <p class="error-message" id="dateError"></p>
                </div>

                <div class="form-group">
                    <label for="amount">Amount (FIELD3)</label>
                    <input type="text" id="amount" placeholder="8000.00" required>
                    <span class="format-hint">Numeric value (e.g., 8000.00)</span>
                    <p class="error-message" id="amountError"></p>
                </div>

                <div class="form-group">
                    <label>Written Amount (FIELD4)</label>
                    <div class="preview-box" id="writtenPreview">Enter an amount to preview...</div>
                </div>

                <button type="submit" id="submitBtn">
                    <span class="spinner" id="spinner" style="display: none;"></span>
                    <span id="btnText">Generate & Download .ods</span>
                </button>
            </form>
        </div>

        <div id="successSection" class="success-section">
            <div class="success-icon">✅</div>
            <div class="success-text">
                <h2>Success!</h2>
                <p>Your cheque file is ready.</p>
            </div>
            <button onclick="location.reload()">Create Another Cheque</button>
        </div>
    </div>

        function escapeXml(str) {
            return str
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&apos;');
        }

        const validMonths = ['jan', 'feb', 'mar', 'apr', 'may', 'jun', 'jul', 'aug', 'sep', 'oct', 'nov', 'dec'];

        function validateDate(d) {
            const p = d.split('-');
            if (p.length !== 3) return false;
            if (p[0].length !== 2 || !/^\d{2}$/.test(p[0])) return false;
            if (p[1].length !== 3 || !validMonths.includes(p[1].toLowerCase())) return false;
            if (p[2].length !== 4 || !/^\d{4}$/.test(p[2])) return false;
            return true;
        }

        function validatePayee(n) {
            return n.trim().split(/\s+/).length >= 2;
        }

        function validateAmount(a) {
            const num = parseFloat(a.replace(/,/g, ''));
            return !isNaN(num) && num > 0 && num < 1000000000;
        }

        function numberToWords(num) {
            const ones = ['', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine'];
            const teens = ['Ten', 'Eleven', 'Twelve', 'Thirteen', 'Fourteen', 'Fifteen', 'Sixteen', 'Seventeen', 'Eighteen', 'Nineteen'];
            const tens = ['', '', 'Twenty', 'Thirty', 'Forty', 'Fifty', 'Sixty', 'Seventy', 'Eighty', 'Ninety'];
            const scales = ['', 'Thousand', 'Million', 'Billion'];

            const convertGroup = (n) => {
                let result = '';
                const h = Math.floor(n / 100);
                const t = Math.floor((n % 100) / 10);
                const o = n % 10;
                if (h > 0) result += ones[h] + ' Hundred ';
                if (t >= 2) result += tens[t] + (o > 0 ? ' ' + ones[o] : '');
                else if (t === 1) result += teens[o];
                else if (o > 0) result += ones[o];
                return result.trim();
            };

            const intPart = Math.floor(num);
            const intStr = intPart.toString().padStart(1, '0');
            const groups = [];
            for (let i = intStr.length; i > 0; i -= 3) {
                groups.unshift(intStr.slice(Math.max(0, i - 3), i));
            }

            let words = groups
                .map((group, idx) => {
                    const groupNum = parseInt(group);
                    if (groupNum === 0) return '';
                    return convertGroup(groupNum) + (scales[groups.length - idx - 1] ? ' ' + scales[groups.length - idx - 1] : '');
                })
                .filter(Boolean)
                .join(' ');

            const cents = Math.round((num % 1) * 100);
            if (cents > 0) {
                words += ' Dollars And ' + convertGroup(cents) + ' Cents';
            } else {
                words += ' Dollars';
            }
            return words;
        }

        function showError(input, errorEl, message) {
            input.classList.add('error');
            errorEl.textContent = message;
            errorEl.classList.add('show');
        }

        function clearError(input, errorEl) {
            input.classList.remove('error');
            errorEl.classList.remove('show');
        }

        const payeeInput = document.getElementById('payee');
        const dateInput = document.getElementById('date');
        const amountInput = document.getElementById('amount');
        const writtenPreview = document.getElementById('writtenPreview');
        const submitBtn = document.getElementById('submitBtn');
        const spinner = document.getElementById('spinner');
        const btnText = document.getElementById('btnText');
        const formSection = document.getElementById('formSection');
        const successSection = document.getElementById('successSection');

        amountInput.addEventListener('input', () => {
            if (validateAmount(amountInput.value)) {
                const num = parseFloat(amountInput.value.replace(/,/g, ''));
                const written = numberToWords(num);
                writtenPreview.textContent = written;
                writtenPreview.classList.add('filled');
            } else {
                writtenPreview.textContent = 'Enter an amount to preview...';
                writtenPreview.classList.remove('filled');
            }
        });

        document.getElementById('chequeForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const payeeError = document.getElementById('payeeError');
            const dateError = document.getElementById('dateError');
            const amountError = document.getElementById('amountError');
            let isValid = true;

            if (!validatePayee(payeeInput.value)) {
                showError(payeeInput, payeeError, '❌ Enter first and last name');
                isValid = false;
            } else {
                clearError(payeeInput, payeeError);
            }

            if (!validateDate(dateInput.value)) {
                showError(dateInput, dateError, '❌ Use DD-MMM-YYYY format');
                isValid = false;
            } else {
                clearError(dateInput, dateError);
            }

            if (!validateAmount(amountInput.value)) {
                showError(amountInput, amountError, '❌ Enter a valid amount');
                isValid = false;
            } else {
                clearError(amountInput, amountError);
            }

            if (!isValid) return;

            submitBtn.disabled = true;
            spinner.style.display = 'inline-block';
            btnText.textContent = 'Processing...';

            try {
                const binaryString = atob(TEMPLATE_B64);
                const bytes = new Uint8Array(binaryString.length);
                for (let i = 0; i < binaryString.length; i++) {
                    bytes[i] = binaryString.charCodeAt(i);
                }

                const zip = new JSZip();
                await zip.loadAsync(bytes);

                let contentXml = await zip.file('content.xml').async('string');

                const escapedPayee = escapeXml(payeeInput.value);
                const escapedDate = escapeXml(dateInput.value);
                const escapedAmount = escapeXml(amountInput.value.replace(/,/g, ''));
                const escapedWritten = escapeXml(writtenPreview.textContent);

                contentXml = contentXml.split('** FIELD1 **').join(escapedPayee);
                contentXml = contentXml.split('>FIELD2<').join('>' + escapedDate + '<');
                contentXml = contentXml.split('$ FIELD3 <text:s/>**').join('$' + escapedAmount + ' **');
                contentXml = contentXml.split('** FIELD4 **').join(escapedWritten);

                zip.file('content.xml', contentXml);

                const blob = await zip.generateAsync({ type: 'blob' });

                // Trigger download
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'cheque-' + payeeInput.value.replace(/\s+/g, '-').toLowerCase() + '.ods';
                a.click();
                URL.revokeObjectURL(url);

                // Show success message
                formSection.classList.add('hidden');
                successSection.classList.add('show');
            } catch (error) {
                alert('Error: ' + error.message);
                console.error(error);
            } finally {
                submitBtn.disabled = false;
                spinner.style.display = 'none';
                btnText.textContent = 'Generate & Download .ods';
            }
        });
    </script>
