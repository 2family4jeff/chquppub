<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SDO File Updater</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 500px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        input.error {
            border-color: #d32f2f;
            background-color: #ffebee;
        }

        .format-hint {
            display: block;
            font-size: 12px;
            color: #999;
            margin-top: 4px;
        }

        .error-message {
            color: #d32f2f;
            font-size: 12px;
            margin-top: 4px;
            display: none;
            font-weight: 500;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: 3px solid white;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #updateForm {
            display: block;
        }

        .success-message {
            display: none;
            text-align: center;
            padding: 30px 20px;
            background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%);
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .success-message h3 {
            color: #2e7d32;
            margin-bottom: 15px;
            font-size: 22px;
        }

        .success-message p {
            color: #388e3c;
            margin-bottom: 20px;
            font-size: 14px;
            line-height: 1.6;
        }

        .download-link {
            display: inline-block;
            background: #4caf50;
            color: white;
            padding: 12px 30px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            font-size: 14px;
        }

        .download-link:hover {
            background: #45a049;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(76, 175, 80, 0.4);
        }

        .reset-btn {
            background: #757575;
            margin-top: 10px;
        }

        .reset-btn:hover {
            background: #616161;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📄 SDO File Updater</h1>
        <p class="subtitle">Update fields in your .sdo document with ease</p>

        <form id="updateForm">
            <div class="form-group">
                <label for="date">Date (FIELD1)</label>
                <input 
                    type="text" 
                    id="date" 
                    name="date" 
                    placeholder="15-Mar-2026"
                    required
                >
                <span class="format-hint">Format: DD-MMM-YYYY (e.g., 15-Mar-2026)</span>
                <p class="error-message" id="dateError"></p>
            </div>

            <div class="form-group">
                <label for="name">Name (FIELD2)</label>
                <input 
                    type="text" 
                    id="name" 
                    name="name" 
                    placeholder="Jane Doe"
                    required
                >
                <span class="format-hint">Format: First Last (e.g., Jane Doe)</span>
                <p class="error-message" id="nameError"></p>
            </div>

            <div class="form-group">
                <label for="amount">Amount (FIELD3)</label>
                <input 
                    type="text" 
                    id="amount" 
                    name="amount" 
                    placeholder="8000.00"
                    required
                >
                <span class="format-hint">Format: Numeric (e.g., 8000.00). Written amount will be auto-generated.</span>
                <p class="error-message" id="amountError"></p>
            </div>

            <button type="submit" id="submitBtn">
                <span id="btnText">Update File</span>
                <span class="spinner" id="spinner" style="display: none;"></span>
            </button>
        </form>

        <div class="success-message" id="successMessage">
            <h3>✅ File Updated Successfully!</h3>
            <p>Your updated file includes: <strong id="generatedAmount"></strong></p>
            <a href="#" class="download-link" id="downloadLink">Download Updated File</a>
            <button class="reset-btn" id="resetBtn">Update Another File</button>
        </div>
    </div>

        const ONES = [
            "Zero", "One", "Two", "Three", "Four", "Five", "Six", "Seven", "Eight", "Nine",
            "Ten", "Eleven", "Twelve", "Thirteen", "Fourteen", "Fifteen", "Sixteen", 
            "Seventeen", "Eighteen", "Nineteen"
        ];
        const TENS = ["", "", "Twenty", "Thirty", "Forty", "Fifty", "Sixty", "Seventy", "Eighty", "Ninety"];

        function numberToWords(n) {
            if (n === 0) return "Zero";
            if (n < 20) return ONES[n];
            if (n < 100) {
                const q = Math.floor(n / 10);
                const r = n % 10;
                return TENS[q] + (r ? "-" + ONES[r] : "");
            }
            if (n < 1000) {
                const q = Math.floor(n / 100);
                const r = n % 100;
                return ONES[q] + " Hundred" + (r ? " " + numberToWords(r) : "");
            }
            if (n < 1000000) {
                const q = Math.floor(n / 1000);
                const r = n % 1000;
                return numberToWords(q) + " Thousand" + (r ? " " + numberToWords(r) : "");
            }
            if (n < 1000000000) {
                const q = Math.floor(n / 1000000);
                const r = n % 1000000;
                return numberToWords(q) + " Million" + (r ? " " + numberToWords(r) : "");
            }
            throw new Error("Amount too large");
        }

        function amountInWords(amount) {
            const cents = Math.round((amount * 100) % 100);
            const dollars = Math.floor(amount);

            if (dollars === 0 && cents === 0) {
                return "Zero Dollars and 0/100";
            }

            let dollarsWords = "";
            if (dollars > 0) {
                dollarsWords = numberToWords(dollars) + " Dollar" + (dollars !== 1 ? "s" : "");
            }

            let result;
            if (cents === 0) {
                result = dollarsWords ? `${dollarsWords} and 00/100` : "0/100";
            } else {
                result = dollarsWords ? `${dollarsWords} and ${cents.toString().padStart(2, '0')}/100` : `${cents.toString().padStart(2, '0')}/100`;
            }

            return result.trim();
        }

        function validateDate(dateStr) {
            const datePattern = /^(\d{2})-([A-Za-z]{3})-(\d{4})$/;
            if (!datePattern.test(dateStr)) return false;

            const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
            const match = dateStr.match(datePattern);
            const day = parseInt(match[1]);
            const monthAbbr = match[2];
            const year = parseInt(match[3]);

            if (year < 1900 || year > 2100) return false;
            if (!months.map(m => m.toLowerCase()).includes(monthAbbr.toLowerCase())) return false;
            if (day < 1 || day > 31) return false;

            return true;
        }

        function validateName(name) {
            const namePattern = /^[A-Za-z]+ [A-Za-z]+$/;
            return namePattern.test(name);
        }

        function validateAmount(amount) {
            const amountPattern = /^\d+(\.\d{1,2})?$/;
            if (!amountPattern.test(amount)) return false;
            const numericAmount = parseFloat(amount);
            return numericAmount >= 0 && numericAmount < 1000000000;
        }

        function showError(input, errorElement, message) {
            input.classList.add('error');
            errorElement.textContent = message;
            errorElement.style.display = 'block';
        }

        function clearError(input, errorElement) {
            input.classList.remove('error');
            errorElement.textContent = '';
            errorElement.style.display = 'none';
        }

        function showSuccess(blob, writtenAmount) {
            const url = URL.createObjectURL(blob);
            const downloadLink = document.getElementById('downloadLink');
            downloadLink.href = url;
            downloadLink.download = 'Cory_6Aug20262_updated.sdo';
            document.getElementById('generatedAmount').textContent = writtenAmount;
            document.getElementById('successMessage').style.display = 'block';
            document.getElementById('updateForm').style.display = 'none';
        }

        async function processFile(dateStr, name, amount) {
            const binaryString = atob(TEMPLATE_B64);
            const bytes = new Uint8Array(binaryString.length);
            for (let i = 0; i < binaryString.length; i++) {
                bytes[i] = binaryString.charCodeAt(i);
            }

            const zip = new JSZip();
            await zip.loadAsync(bytes);

            let contentXml = await zip.file('content.xml').async('string');

            // Replace fields
            contentXml = contentXml.replace(/\*\* FIELD1 \*\*/g, dateStr);
            contentXml = contentXml.replace(/\bFIELD2\b/g, name);
            contentXml = contentXml.replace(/\$ FIELD3\s*(?:<[^>]*)?\s*\*\*/g, `$${parseFloat(amount).toFixed(2)}`);
            
            const writtenAmount = amountInWords(parseFloat(amount));
            contentXml = contentXml.replace(/\*\* FIELD4 \*\*/g, writtenAmount);

            zip.file('content.xml', contentXml);

            const blob = await zip.generateAsync({ type: 'blob' });
            return { blob, writtenAmount };
        }

        const form = document.getElementById('updateForm');
        const dateInput = document.getElementById('date');
        const nameInput = document.getElementById('name');
        const amountInput = document.getElementById('amount');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const spinner = document.getElementById('spinner');
        const resetBtn = document.getElementById('resetBtn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            let isValid = true;

            const dateError = document.getElementById('dateError');
            if (!validateDate(dateInput.value)) {
                showError(dateInput, dateError, '❌ Please use DD-MMM-YYYY format (e.g., 06-Aug-2026)');
                isValid = false;
            } else {
                clearError(dateInput, dateError);
            }

            const nameError = document.getElementById('nameError');
            if (!validateName(nameInput.value)) {
                showError(nameInput, nameError, '❌ Please enter name in "First Last" format');
                isValid = false;
            } else {
                clearError(nameInput, nameError);
            }

            const amountError = document.getElementById('amountError');
            if (!validateAmount(amountInput.value)) {
                showError(amountInput, amountError, '❌ Please enter a valid numeric amount (e.g., 8000.00)');
                isValid = false;
            } else {
                clearError(amountInput, amountError);
            }

            if (!isValid) return;

            submitBtn.disabled = true;
            btnText.textContent = 'Processing...';
            spinner.style.display = 'inline-block';

            try {
                const { blob, writtenAmount } = await processFile(dateInput.value, nameInput.value, amountInput.value);
                showSuccess(blob, writtenAmount);
            } catch (error) {
                alert('Error: ' + error.message);
            } finally {
                submitBtn.disabled = false;
                btnText.textContent = 'Update File';
                spinner.style.display = 'none';
            }
        });

        dateInput.addEventListener('input', () => clearError(dateInput, document.getElementById('dateError')));
        nameInput.addEventListener('input', () => clearError(nameInput, document.getElementById('nameError')));
        amountInput.addEventListener('input', () => clearError(amountInput, document.getElementById('amountError')));

        resetBtn.addEventListener('click', () => {
            form.reset();
            document.getElementById('successMessage').style.display = 'none';
            document.getElementById('updateForm').style.display = 'block';
        });
    </script>
